[project]
name = "ucc-ft"
version = "0.1.0"
description = "Fault-tolerance circuit checker for Unitary Coupled Cluster (UCC)"
authors = [
    { name = "Brad Chase", email = "brad@unitary.foundation"},
]
readme = "README.md"
requires-python = "~=3.14.3"
dependencies = [
    "juliacall>=0.9.31",
    "juliapkg>=0.1.23",
    "openqasm3[parser]>=1.0.1",
    "pyqasm>=1.0.2",
    "qiskit>=2.3.1",
    "qiskit-qasm3-import>=0.6.0",
    "stim>=1.15.0",
    "z3-solver>=4.16.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.5",
    "ruff>=0.11.8",
]
